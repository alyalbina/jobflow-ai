name: Product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m ruff check jobflow scripts tests
      - run: python -m ruff format --check jobflow scripts tests
      - run: python -m pytest -q
      - run: node --check web/assets/app.js
      - run: python -m scripts.build_demo
      - run: python -m scripts.check_public
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
